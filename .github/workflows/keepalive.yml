name: Keep Awake

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 30일 무커밋 시 하트비트 커밋용

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: 앱 깨우기
        run: python wake.py
      - name: 하트비트 커밋 (마지막 커밋이 30일 넘었을 때만)
        if: ${{ !cancelled() }}   # 깨우기가 실패해도 하트비트는 실행
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( $(date +%s) - last ))
          echo "마지막 커밋 후 $(( age / 86400 ))일 경과"
          [ "$age" -gt 2592000 ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive heartbeat"
          git push
